<body>
  <div class="card">
    <h2 style="margin-top:0">Iniciar sesión en SENCE</h2>
    <p class="muted">Usa tu <strong>Clave Única SENCE (CUS)</strong>.</p>

   <form id="formSence" action="{{ url_for('login_sence_submit') }}" method="post" novalidate>
  <div class="row">
    <label for="run_alumno">RUT Participante (formato xxxxxxxx-x)</label>
    <input id="run_alumno" name="run_alumno" 
           placeholder="12345678-9" 
           pattern="^[0-9]{7,8}-[0-9Kk]{1}$"
           title="Debe ingresar un RUT válido, ej: 12345678-9"
           maxlength="10"
           required />
  </div>

  <div class="row">
    <label for="cod_sence">Código SENCE del curso</label>
    <input id="cod_sence" name="cod_sence"
           pattern="^[A-Za-z0-9]+$"
           title="Solo letras y números"
           maxlength="10"
           required />
  </div>

  <div class="row">
    <label for="codigo_curso">Identificador del curso (mínimo 8 caracteres)</label>
    <input id="codigo_curso" name="codigo_curso"
           minlength="8"
           maxlength="50"
           required />
  </div>

  <button type="submit">Iniciar sesión</button>
</form>

<script>
document.getElementById('formSence').addEventListener('submit', function(e) {
  const rut = document.getElementById('run_alumno').value.trim();
  const codSence = document.getElementById('cod_sence').value.trim();
  const codigoCurso = document.getElementById('codigo_curso').value.trim();

  // Validación básica de RUT
  if (!/^[0-9]{7,8}-[0-9Kk]{1}$/.test(rut)) {
    alert('El RUT debe tener el formato correcto (ej: 12345678-9)');
    e.preventDefault();
    return;
  }

  // Validación cod_sence
  if (!/^[A-Za-z0-9]+$/.test(codSence) || codSence.length > 10) {
    alert('El Código SENCE debe tener solo letras/números y máximo 10 caracteres.');
    e.preventDefault();
    return;
  }

  // Validación codigo_curso
  if (codigoCurso.length < 8 || codigoCurso.length > 50) {
    alert('El Código del curso debe tener entre 8 y 50 caracteres.');
    e.preventDefault();
    return;
  }
});
</script>
