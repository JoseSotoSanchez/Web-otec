      crossorigin="anonymous"
    />
    <link

      href="static/css/estilos.css"
      crossorigin="anonymous"
    />

    <title>{% block title %}Inicio{% endblock %}</title>
    <link rel="shortcut icon" href="static/Imagenes/logoweb.png">
    
</head>
<body>
    <div class=" bg-light rounded-3">
        <div class="container-fluid ">
          <div class=" mx-auto">
              <div class="row d-flex justify-content-center">
                  <div class=" text-center">
                      <div class="card table-responsive">
                        <span class="fs-4" style="margin: 20px;" data-aos="fade-right">Detalles de pago</span>
                        <table class="table align-middle mb-0 bg-white">
                          <thead class="bg-light">
                            <tr>
                                <th class="th-sm">Id Pago</th>
                                <th class="th-sm">Id Alumno</th>
                                <th class="th-sm">Id Curso</th>
                                <th class="th-sm">Forma de Pago</th>
                                <th class="th-sm">Monto</th>
                                <th class="th-sm">Fecha</th>
                            </tr>
                          </thead>
                          <tbody>
                              {% for row in pagos %}
                            <tr>
                              <td>{{row[0]}}</td>
                              <td>{{row[1]}}</td>
                              <td>{{row[2]}}</td>
                              <td>{{row[3]}}</td>
                              <td>{{row[4]}}</td>
                              <td>{{row[5]}}</td>
                            </tr>
                            {% endfor %}
                          
                          </tbody>
                      </table>
                          {{ pagination.info }}
                          {{ pagination.links }}
                      </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
